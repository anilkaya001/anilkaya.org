# Cloudflare Worker (Static Assets + API). This configuration is used by direct
# `wrangler deploy` commands and can be used by a verified Workers Builds setup.

name = "anilkaya"
main = "worker.js"
compatibility_date = "2026-07-14"

# Serve the repo root as the static site; .assetsignore keeps server/config
# files out of the public bundle. Worker-first routing is required because
# worker.js applies security/cache headers and crawler metadata to assets.
[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Persist production invocation logs for incident diagnosis. Application code
# only emits structured errors; normal static requests do not create log noise.
[observability]
enabled = true
head_sampling_rate = 1

# D1 target. Verify the remote schema separately before any deployment.
[[d1_databases]]
binding = "DB"
database_name = "iewt"
database_id = "73c8c626-e971-44da-b8c1-21d6062cb9f2"
migrations_dir = "migrations"

# Workers AI, for the question box at /flows/ask. It is included in the Workers
# FREE plan: 10,000 Neurons per day, account-wide, reset at 00:00 UTC. Nothing
# else on this account spends them today, and the route is built so that
# running out costs a reader the phrasing and not the answer — every figure it
# prints was measured by the pipeline and is served whether or not a model
# ever replies.
#
# THE ALLOWANCE IS THE ACCOUNT'S, NOT THIS ROUTE'S, so nothing here tries to
# predict it. A counter in the Worker could only ever say what this route
# spent, and reporting that as a remaining balance would be exactly the
# confident unmeasured number the rest of this codebase refuses. Cloudflare
# reports exhaustion itself, and distinguishes error 3036 (the day's free
# allocation is spent) from 3040 (no capacity right now) — both HTTP 429, and
# two different sentences for a reader.
[ai]
binding = "AI"

# Refresh the landing-page market snapshot every 15 minutes. The scheduled()
# handler fetches index quotes and upserts one D1 row; /api/markets serves it.
[triggers]
crons = ["*/15 * * * *"]

# Plain variables. FLOWS_SESSION_EPOCH is the session revocation lever: it is
# not sensitive — it is a counter whose only job is to invalidate outstanding
# Flows sessions — so it belongs here rather than in the secret store.
# Incrementing it and redeploying signs every Flows user out immediately.
# Leaving it unset is safe: sessionEpoch() defaults to "1", which is a stable
# epoch rather than an undefined-versus-undefined comparison.
[vars]
# "2": the 2026-08-31 credential rotation — every cookie minted under the
# previous credential set dies on deploy.
FLOWS_SESSION_EPOCH = "2"
# Which Workers AI model /api/flows/ask asks for wording. Free-tier membership
# is a moving target — the 2026-07-28 catalogue change moved three models to
# Paid — so this is a variable rather than a constant in worker.js, and setting
# it EMPTY is a supported state meaning "no model": the route then serves the
# deterministic reading and says so. Nothing about the answer's figures depends
# on it; only the phrasing does.
FLOWS_ASK_MODEL = "@cf/zai-org/glm-4.7-flash"

# Secrets are NOT stored here. Set them in the Worker dashboard
# (Settings → Variables and Secrets) or via `wrangler secret put`:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET
#   FLOWS_PEPPER, FLOWS_CREDENTIALS, FLOWS_INGEST_TOKEN
# FLOWS_INGEST_TOKEN must ALSO be set as a GitHub repository secret with the
# same value: it is what authenticates the Actions pipeline to /api/flows/ingest.
# BASE_URL is intentionally unset — the Worker uses the request's own origin.
