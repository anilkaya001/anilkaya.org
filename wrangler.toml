name = "anilkaya"
main = "worker.js"
compatibility_date = "2026-07-14"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "iewt"
database_id = "73c8c626-e971-44da-b8c1-21d6062cb9f2"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["*/15 * * * *"]

[vars]
FLOWS_SESSION_EPOCH = "2"
FLOWS_ASK_MODEL = "@cf/zai-org/glm-4.7-flash"
FLOWS_ASK_NEURONS = "5500,36400"
FLOWS_ASK_FALLBACK_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
FLOWS_ASK_FALLBACK_NEURONS = "26668,204805"

