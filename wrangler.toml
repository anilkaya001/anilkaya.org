# Cloudflare Worker (Static Assets + API). This configuration is used by direct
# `wrangler deploy` commands and can be used by a verified Workers Builds setup.

name = "anilkaya"
main = "worker.js"
compatibility_date = "2026-07-14"

# Serve the repo root as the static site; .assetsignore keeps server/config
# files out of the public bundle. Worker-first routing is required because
# worker.js applies security/cache headers and crawler metadata to assets.
[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# Persist production invocation logs for incident diagnosis. Application code
# only emits structured errors; normal static requests do not create log noise.
[observability]
enabled = true
head_sampling_rate = 1

# D1 target. Verify the remote schema separately before any deployment.
[[d1_databases]]
binding = "DB"
database_name = "iewt"
database_id = "73c8c626-e971-44da-b8c1-21d6062cb9f2"

# Secrets are NOT stored here. Set them in the Worker dashboard
# (Settings → Variables and Secrets) or via `wrangler secret put`:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET
# BASE_URL is intentionally unset — the Worker uses the request's own origin.
