# Cloudflare Pages config (used when this repo is deployed to Cloudflare Pages).
# Has NO effect on the current GitHub Pages deployment.

name = "anilkaya-org"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# D1 binding — database "iewt" already created and migrated (schema.sql applied).
[[d1_databases]]
binding = "DB"
database_name = "iewt"
database_id = "73c8c626-e971-44da-b8c1-21d6062cb9f2"

[vars]
BASE_URL = "https://anilkaya.org"

# Secrets — DO NOT put these here. Set them in the Pages dashboard
# (Settings → Environment variables, encrypted) or via:
#   wrangler pages secret put GOOGLE_CLIENT_ID
#   wrangler pages secret put GOOGLE_CLIENT_SECRET
#   wrangler pages secret put SESSION_SECRET   # any long random string
