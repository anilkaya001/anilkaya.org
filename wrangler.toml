name = "anilkaya"
main = "worker.js"
compatibility_date = "2026-07-08"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/*", "!/assets/*"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "iewt"
database_id = "73c8c626-e971-44da-b8c1-21d6062cb9f2"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["1-59/5 13-21 * * MON-FRI", "3-58/5 13-21 * * MON-FRI", "*/30 * * * *", "15,45 * * * *"]

[[ratelimits]]
name = "UW_ONDEMAND"
namespace_id = "1101"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "AI_ASK"
namespace_id = "1102"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "MEMBER_VENDOR"
namespace_id = "1103"
simple = { limit = 60, period = 60 }

[[durable_objects.bindings]]
name = "PULSE"
class_name = "Pulse"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pulse"]

[vars]
FLOWS_SESSION_EPOCH = "2"
FLOWS_ASK_MODEL = "@cf/zai-org/glm-4.7-flash"
FLOWS_ASK_NEURONS = "5500,36400"
FLOWS_ASK_FALLBACK_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
FLOWS_ASK_FALLBACK_NEURONS = "26668,204805"
FLOWS_AI_DAILY_CAP_NEURONS = "30000"
FLOWS_AI_DAILY_CAP_CALLS = "2500"
FLOWS_READ_MODE = "on"
FLOWS_LIVE_MODE = "actions"
FLOWS_LIVE_REPO = "anilkaya001/anilkaya.org"
FLOWS_LIVE_REF = "main"
FLOWS_LIVE_WORKFLOW = "flows-live.yml"
FLOWS_NIGHTLY_WORKFLOW = "flows-pipeline.yml"
FLOWS_RT_MODE = "on"
FLOWS_RT_AUDIENCE = "members"
FLOWS_RT_USERS = "anilkaya"
FLOWS_RT_HINT = "enam"
