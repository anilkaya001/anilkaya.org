# Cloudflare Worker (Static Assets + API). Used when deployed to Cloudflare
# via `wrangler deploy`. Has NO effect on the current GitHub Pages site.

name = "anilkaya"
main = "worker.js"
compatibility_date = "2024-11-01"

# Serve the repo root as the static site; .assetsignore keeps server/config
# files out of the public bundle. The Worker (worker.js) only runs for routes
# that are not static assets (i.e. /auth/* and /api/*).
[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

# D1 — database "iewt" is already created and migrated (schema.sql applied).
[[d1_databases]]
binding = "DB"
database_name = "iewt"
database_id = "73c8c626-e971-44da-b8c1-21d6062cb9f2"

# Secrets are NOT stored here. Set them in the Worker dashboard
# (Settings → Variables and Secrets) or via `wrangler secret put`:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SESSION_SECRET
# BASE_URL is intentionally unset — the Worker uses the request's own origin.
