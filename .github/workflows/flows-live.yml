name: flows-live

on:
  workflow_dispatch:
    inputs:
      tick:
        description: "The Worker clock instant that dispatched this run"
        type: string
        required: false
      origin:
        description: "Who dispatched it: worker, watchdog, chain or manual"
        type: string
        required: false
        default: manual
      drill:
        description: "Open one witness issue and close it at once, to prove the alert channel, and do nothing else"
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1-5"
    - cron: "47 5 * * 1-5"
    - cron: "17 6 * * 1-5"
    - cron: "47 6 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "47 7 * * 1-5"
    - cron: "17 8 * * 1-5"
    - cron: "47 8 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "47 9 * * 1-5"
    - cron: "17 10 * * 1-5"
    - cron: "47 10 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "47 11 * * 1-5"
    - cron: "17 12 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "17 13 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "17 14 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "17 15 * * 1-5"
    - cron: "47 15 * * 1-5"
    - cron: "17 16 * * 1-5"
    - cron: "47 16 * * 1-5"
    - cron: "17 17 * * 1-5"
    - cron: "47 17 * * 1-5"
    - cron: "17 18 * * 1-5"
    - cron: "47 18 * * 1-5"
    - cron: "17 19 * * 1-5"
    - cron: "47 19 * * 1-5"
    - cron: "17 20 * * 1-5"
    - cron: "47 20 * * 1-5"

permissions:
  contents: read
  id-token: write
  actions: write
  issues: write

concurrency:
  group: ${{ inputs.drill && 'flows-live-drill' || 'flows-live' }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE_READY: ${{ secrets.UW_API_KEY != '' }}
    steps:
      - name: Wait for the vendor key
        if: env.LIVE_READY != 'true'
        run: |
          echo "::notice title=Live layer idle::UW_API_KEY is not set as a repository secret, so Tier 2 does not run; the Worker's own Tier 1 tick runs without it."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: env.LIVE_READY == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            shared

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: env.LIVE_READY == 'true'
        with:
          node-version: 22

      - name: Say who dispatched this run
        if: env.LIVE_READY == 'true'
        env:
          EVENT: ${{ github.event_name }}
          ORIGIN: ${{ inputs.origin || 'schedule' }}
          TICK: ${{ inputs.tick || 'none' }}
          FIRED: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "event: $EVENT; origin: $ORIGIN; tick: $TICK; cron that fired: '${FIRED:-none}'"
          started="$(date -u +%s)"
          echo "Started at $(date -u -d "@$started" +%H:%M:%S) UTC, $(TZ=America/New_York date -d "@$started" +%H:%M:%S) Eastern."
          re='^([0-9]+) ([0-9]+) '
          if [[ "$FIRED" =~ $re ]]; then
            printf -v slot '%02d:%02d' "$((10#${BASH_REMATCH[2]}))" "$((10#${BASH_REMATCH[1]}))"
            created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)" || created=""
            if [ -n "$created" ] && at="$(date -u -d "$created" +%s)" && due="$(date -u -d "$(date -u -d "@$at" +%F) $slot" +%s)"; then
              echo "GitHub created this run at $(date -u -d "@$at" +%H:%M:%S) UTC, $(( (at - due + 86400) % 86400 / 60 )) min after its $slot UTC slot; this step ran $(( (started - at) / 60 )) min after that, the time the run queued for the flows-live concurrency group and a runner."
            else
              echo "The run's created_at could not be read, so how late GitHub delivered the $slot UTC starter is left to the Actions API."
            fi
          fi

      - name: Read the live layer
        if: env.LIVE_READY == 'true'
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FLOWS_INGEST_URL: ${{ secrets.FLOWS_INGEST_URL }}
          FLOWS_LIVE_ORIGIN: ${{ github.event_name == 'schedule' && 'schedule' || inputs.origin || 'manual' }}
          FLOWS_LIVE_LOOP: "1"
          FLOWS_LIVE_KEEP: "1"
          FLOWS_LIVE_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.drill && '1' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/flows-pipeline.mjs --live
