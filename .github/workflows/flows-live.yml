name: flows-live

on:
  workflow_dispatch:
    inputs:
      tick:
        description: "The Worker clock instant that dispatched this run"
        type: string
        required: false
      origin:
        description: "Who dispatched it: worker, watchdog, chain or manual"
        type: string
        required: false
        default: manual
  schedule:
    - cron: "17 5 * * 1-5"
    - cron: "17 6 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "17 8 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "17 10 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "17 12 * * 1-5"
    - cron: "17 13 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "17 14 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "17 15 * * 1-5"
    - cron: "47 15 * * 1-5"
    - cron: "17 16 * * 1-5"
    - cron: "47 16 * * 1-5"
    - cron: "17 17 * * 1-5"
    - cron: "47 17 * * 1-5"
    - cron: "17 18 * * 1-5"
    - cron: "47 18 * * 1-5"
    - cron: "17 19 * * 1-5"
    - cron: "47 19 * * 1-5"
    - cron: "17 20 * * 1-5"
    - cron: "47 20 * * 1-5"

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: flows-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE_READY: ${{ secrets.UW_API_KEY != '' }}
    steps:
      - name: Wait for the vendor key
        if: env.LIVE_READY != 'true'
        run: |
          echo "::notice title=Live layer idle::UW_API_KEY is not set as a repository secret, so Tier 2 does not run; the Worker's own Tier 1 tick runs without it."

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: env.LIVE_READY == 'true'
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            shared

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: env.LIVE_READY == 'true'
        with:
          node-version: 22

      - name: Say who dispatched this run
        if: env.LIVE_READY == 'true'
        env:
          EVENT: ${{ github.event_name }}
          ORIGIN: ${{ inputs.origin || 'schedule' }}
          TICK: ${{ inputs.tick || 'none' }}
          FIRED: ${{ github.event.schedule }}
        run: |
          echo "event: $EVENT; origin: $ORIGIN; tick: $TICK; cron that fired: '${FIRED:-none}'"
          echo "Started at $(date -u +%H:%M:%S) UTC, $(TZ=America/New_York date +%H:%M:%S) Eastern."
          re='^([0-9]+) ([0-9]+) '
          if [[ "$FIRED" =~ $re ]]; then
            slot="$(date -u -d "$(date -u +%F) ${BASH_REMATCH[2]}:${BASH_REMATCH[1]}" +%s)"
            echo "GitHub delivered the ${BASH_REMATCH[2]}:${BASH_REMATCH[1]} UTC starter $(( ($(date -u +%s) - slot + 86400) % 86400 / 60 )) minutes after its slot."
          fi

      - name: Read the live layer
        if: env.LIVE_READY == 'true'
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FLOWS_INGEST_URL: ${{ secrets.FLOWS_INGEST_URL }}
          FLOWS_LIVE_ORIGIN: ${{ github.event_name == 'schedule' && 'schedule' || inputs.origin || 'manual' }}
          FLOWS_LIVE_LOOP: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/flows-pipeline.mjs --live
