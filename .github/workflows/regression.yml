name: regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      source: ${{ steps.reuse.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Look for a green pull-request run of this exact tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-reuse.mjs

  fast:
    needs: [reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Record the tree under test
        id: tree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Install pinned test dependencies
        working-directory: tests
        run: npm ci
      - name: Validate Worker bundle and configuration
        run: ./tests/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/anilkaya-worker-dry-run
      - name: Run the fast group
        working-directory: tests
        env:
          ASSET_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node run.mjs --group fast

  shard:
    needs: [reuse]
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install pinned test dependencies
        working-directory: tests
        run: npm ci
      - name: Decide whether the shard needs Chromium
        id: browser
        working-directory: tests
        run: |
          needs="$(node run.mjs --shard ${{ matrix.shard }}/6 --needs-browser)"
          case "$needs" in true|false) ;; *) echo "run.mjs answered '$needs', not true or false"; exit 1 ;; esac
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        if: steps.browser.outputs.needs == 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run the shard
        working-directory: tests
        run: node run.mjs --shard ${{ matrix.shard }}/6

  test:
    needs: [reuse, fast, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Require the fast job and every shard to pass, or a reused run
        env:
          REUSED: ${{ needs.reuse.outputs.reused }}
          SOURCE: ${{ needs.reuse.outputs.source }}
          FAST: ${{ needs.fast.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "reused: $REUSED; fast: $FAST; shards: $SHARDS"
          if [ "$REUSED" = true ]; then
            test "$FAST" = skipped && test "$SHARDS" = skipped
            echo "reused $SOURCE"
          else
            test "$FAST" = success && test "$SHARDS" = success
          fi
      - name: Record the tested tree on the pull request head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ needs.fast.outputs.tree }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$TREE"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=success -f context=tested-tree -f description="$TREE" -f target_url="$RUN_URL"
