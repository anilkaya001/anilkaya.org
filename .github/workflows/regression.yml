name: regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install pinned test dependencies
        working-directory: tests
        run: npm ci
      - name: Validate Worker bundle and configuration
        run: ./tests/node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/anilkaya-worker-dry-run
      - name: Run the fast group
        working-directory: tests
        env:
          ASSET_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node run.mjs --group fast

  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install pinned test dependencies
        working-directory: tests
        run: npm ci
      - name: Decide whether the shard needs Chromium
        id: browser
        working-directory: tests
        run: |
          needs="$(node run.mjs --shard ${{ matrix.shard }}/6 --needs-browser)"
          case "$needs" in true|false) ;; *) echo "run.mjs answered '$needs', not true or false"; exit 1 ;; esac
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
      - name: Install Chromium
        if: steps.browser.outputs.needs == 'true'
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Run the shard
        working-directory: tests
        run: node run.mjs --shard ${{ matrix.shard }}/6

  test:
    needs: [fast, shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the fast job and every shard to pass
        env:
          FAST: ${{ needs.fast.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "fast: $FAST; shards: $SHARDS"
          test "$FAST" = success && test "$SHARDS" = success
