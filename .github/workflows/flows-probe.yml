name: flows-probe

on:
  schedule:
    - cron: "23 14 * * 0"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Tickers for the per-name probes, comma-separated (at most 10)"
        type: string
        default: "AAPL,NVDA"
      filter:
        description: "Probe only the ids or paths containing this text; commas separate alternatives"
        type: string
        required: false
        default: ""
      strict:
        description: "Fail the run on an unexpected refusal or a field the code reads that did not arrive"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flows-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Probe the vendor schema
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FLOWS_PROBE_TICKERS: ${{ inputs.tickers }}
          FLOWS_PROBE_FILTER: ${{ inputs.filter }}
          FLOWS_PROBE_STRICT: ${{ (github.event_name == 'schedule' || inputs.strict) && '1' || '' }}
        run: node scripts/flows-probe.mjs
