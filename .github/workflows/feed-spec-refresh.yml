name: feed-spec-refresh

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Address of the feed's OpenAPI document (https); empty starts from the documentation page the committed copy links to"
        type: string
        required: false
        default: ""
      with_key:
        description: "If the address refuses an anonymous request, ask once more with the feed key (sent to the feed's own origin only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feed-spec-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: Download, check and compare the document
        env:
          FEED_SPEC_ADDRESS: ${{ inputs.address }}
          UW_API_KEY: ${{ inputs.with_key && secrets.UW_API_KEY || '' }}
        run: node scripts/feed-spec-refresh.mjs

      - name: Push the document to its own branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/feed-spec-refresh.mjs --push
