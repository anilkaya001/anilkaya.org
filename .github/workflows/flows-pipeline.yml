name: flows-pipeline

on:
  schedule:
    - cron: "15 9 * * 1-5"
    - cron: "15 10 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run against synthetic fixtures without publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flows-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve whether this firing is the intended one
        id: gate
        run: |
          ZONE="$(TZ=America/New_York date +%Z)"
          FIRED="${{ github.event.schedule }}"
          echo "Eastern zone is $ZONE; cron that fired: '${FIRED:-none}'"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$FIRED" = "15 9 * * 1-5" ] && [ "$ZONE" = "EDT" ]; then
            echo "09:15 UTC during EDT is 05:15 Eastern — this firing owns today."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$FIRED" = "15 10 * * 1-5" ] && [ "$ZONE" = "EST" ]; then
            echo "10:15 UTC during EST is 05:15 Eastern — this firing owns today."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The other schedule owns today under $ZONE. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the pipeline runs against fixtures
        if: steps.gate.outputs.run == 'true'
        run: node scripts/flows-pipeline.mjs --dry-run

      - name: Build and publish the board
        if: steps.gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FLOWS_INGEST_TOKEN: ${{ secrets.FLOWS_INGEST_TOKEN }}
          FLOWS_INGEST_URL: ${{ secrets.FLOWS_INGEST_URL }}
        run: node scripts/flows-pipeline.mjs

