name: flows-pipeline

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run against synthetic fixtures without publishing"
        type: boolean
        default: false
      allow_intraday:
        description: "Publish even while the Eastern clock is inside the 09:30-16:00 session (every undated read then describes the session in progress)"
        type: boolean
        default: false
      republish_session:
        description: "The session is already archived: delete its scores and dated boards and rewrite them with the live boards, record and cards"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flows-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve whether this firing is the intended one
        id: gate
        run: |
          ZONE="$(TZ=America/New_York date +%Z)"
          FIRED="${{ github.event.schedule }}"
          echo "Eastern zone is $ZONE; cron that fired: '${FIRED:-none}'"
          echo "Started at $(date -u +%H:%M) UTC, $(TZ=America/New_York date +%H:%M) Eastern."
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding. The pipeline itself refuses an in-progress session unless allow_intraday is set."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$FIRED" = "30 21 * * 1-5" ]; then
            echo "21:30 UTC is 17:30 EDT or 16:30 EST — after the close under either zone, and a firing delayed by as much as twelve hours still lands before the next open."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No schedule other than '30 21 * * 1-5' owns a run. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the pipeline runs against fixtures
        if: steps.gate.outputs.run == 'true'
        run: node scripts/flows-pipeline.mjs --dry-run

      - name: Build and publish the board
        if: steps.gate.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FLOWS_INGEST_TOKEN: ${{ secrets.FLOWS_INGEST_TOKEN }}
          FLOWS_INGEST_URL: ${{ secrets.FLOWS_INGEST_URL }}
          FLOWS_ALLOW_INTRADAY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_intraday && '1' || '' }}
          FLOWS_REPUBLISH_SESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.republish_session && '1' || '' }}
        run: node scripts/flows-pipeline.mjs
