name: flows-ws-probe

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to listen on each channel (2 to 60); the five firehoses always get 5"
        type: string
        default: "60"
      only:
        description: "Run only these parts, comma-separated: handshake, channels, firehoses, connections, joins, hold (empty runs all)"
        type: string
        required: false
        default: ""
      hold_seconds:
        description: "Seconds the three held connections stay joined to 60 price channels (1 to 300)"
        type: string
        default: "120"

permissions:
  contents: read

concurrency:
  group: flows-ws-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Probe the vendor socket
        env:
          UW_API_KEY: ${{ secrets.UW_API_KEY }}
          FLOWS_WS_PROBE_SECONDS: ${{ inputs.seconds }}
          FLOWS_WS_PROBE_ONLY: ${{ inputs.only }}
          FLOWS_WS_PROBE_HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: node scripts/flows-ws-probe.mjs
