version: 2
updates:
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      toolchain:
        patterns:
          - "wrangler"
          - "playwright"
      development:
        patterns:
          - "*"
        exclude-patterns:
          - "wrangler"
          - "playwright"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns:
          - "*"
