<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden select-none bg-[#010301]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>In Econometrics We Trust</title>

    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Modern Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        /* State-of-the-art Web & Canvas Optimizations */
        body {
            touch-action: none;
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        canvas {
            image-rendering: high-quality;
            will-change: transform, opacity;
            transform: translateZ(0); /* Force GPU compositing */
        }

        .glow-text-matrix {
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.7), 0 0 15px rgba(0, 255, 65, 0.4);
        }

        .bg-noise {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
        }
    </style>
</head>
<body class="text-slate-100 font-sans h-full w-full overflow-hidden relative flex items-center justify-center antialiased">

    <!-- Global Noise overlay for cinematic texture -->
    <div class="absolute inset-0 z-[1] bg-noise mix-blend-overlay"></div>

    <!-- Deep Ambient Glow (Matrix Theme) -->
    <div class="absolute inset-0 z-[2] bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#003B00]/20 via-[#010501]/90 to-[#010301] pointer-events-none"></div>

    <!-- Core Simulation Canvas -->
    <div class="absolute inset-0 w-full h-full z-[3] pointer-events-auto">
        <canvas id="particleCanvas" class="w-full h-full block cursor-crosshair"></canvas>
    </div>

    <!-- UI Overlay Layer -->
    <main class="relative z-[10] max-w-4xl text-center px-6 pointer-events-none select-none flex flex-col items-center drop-shadow-2xl">
        <h1 class="font-space font-extrabold text-5xl sm:text-7xl lg:text-8xl tracking-tighter leading-[0.95] text-transparent bg-clip-text bg-gradient-to-br from-[#E0FFE0] via-[#00FF41] to-[#008F11] glow-text-matrix">
            In Econometrics<br>We Trust
        </h1>
    </main>

    <!-- Data-Oriented Javascript Particle Engine -->
    <script>
        // --- 1. Performance Constants & Field Parameters ---
        const COUNT = 3000;            // Dense particle cloud
        const SPEED = 0.8;             // Integration time-step
        const MAX_SIZE = 1.2;          // Sharp particle radius
        const FOV = 700;               // Camera Field of View
        const BOUND = 1500;            // Volumetric Boundary

        const PLANCK_H_BAR = 0.8;
        const BOHR_RADIUS = 160;       // Base distance for orbitals (n=1)
        const N_LEVELS = 6;            // Number of discrete orbitals (n=1 to 6)

        const PALETTE = ['#00FF41', '#008F11', '#32CD32', '#98FB98', '#FFFFFF', '#004000'];

        // --- 2. Data-Oriented Design (DOD) Memory Buffers ---
        const pX = new Float32Array(COUNT);
        const pY = new Float32Array(COUNT);
        const pZ = new Float32Array(COUNT);
        const vX = new Float32Array(COUNT);
        const vY = new Float32Array(COUNT);
        const vZ = new Float32Array(COUNT);

        const pPhase = new Float32Array(COUNT);
        const pEnergyLevel = new Uint8Array(COUNT);
        const pSpin = new Int8Array(COUNT);
        const pEntangled = new Uint16Array(COUNT);
        const pColor = new Uint8Array(COUNT);

        // Render Output Buffers
        const sX = new Float32Array(COUNT);
        const sY = new Float32Array(COUNT);
        const sScale = new Float32Array(COUNT);
        const pZRot = new Float32Array(COUNT);
        const pVisible = new Uint8Array(COUNT);
        const pUncertainty = new Float32Array(COUNT);

        // --- 3. Engine & Camera State ---
        const state = {
            targetPitch: Math.PI / 8,
            targetYaw: Math.PI / 4,
            pitch: 0, yaw: 0,
            width: 0, height: 0,
            dpr: 1,
            isObserved: false,
            time: 0
        };

        let canvas, ctx;
        let lastTime = performance.now();

        function initEngine() {
            canvas = document.getElementById('particleCanvas');
            ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

            const resizeObserver = new ResizeObserver(() => resizeCanvas());
            resizeObserver.observe(document.body);
            resizeCanvas();

            // Pointer Event Listeners for field collapse
            window.addEventListener('pointerdown', (e) => {
                state.isObserved = true;
                handlePointerMove(e);
            });
            window.addEventListener('pointermove', (e) => {
                if (state.isObserved) handlePointerMove(e);
            });
            window.addEventListener('pointerup', () => {
                state.isObserved = false;
            });
            window.addEventListener('pointercancel', () => { state.isObserved = false; });
            window.addEventListener('touchstart', (e) => { if(e.target === canvas) e.preventDefault(); }, { passive: false });

            // Initialize states into strict flat rings
            for (let i = 0; i < COUNT; i++) {
                pEnergyLevel[i] = Math.floor(Math.random() * N_LEVELS) + 1;

                const radius = pEnergyLevel[i] * BOHR_RADIUS + (Math.random() * 30 - 15);
                const theta = Math.random() * Math.PI * 2;

                pX[i] = radius * Math.cos(theta);
                pY[i] = (Math.random() - 0.5) * 20; // Very tight flat disk
                pZ[i] = radius * Math.sin(theta);

                pPhase[i] = Math.random() * Math.PI * 2;
                pSpin[i] = Math.random() > 0.5 ? 1 : -1;

                if (i % 2 === 0 && i < COUNT - 1) {
                    pEntangled[i] = i + 1;
                    pEntangled[i+1] = i;
                    pSpin[i+1] = -pSpin[i];
                } else if (i % 2 !== 0) {
                    pEntangled[i] = i - 1;
                }

                pColor[i] = Math.floor(Math.random() * PALETTE.length);

                // Set initial orbital speeds
                const tangentX = -pZ[i] / radius;
                const tangentZ = pX[i] / radius;
                const orbitSpeed = 6.0 / pEnergyLevel[i];

                vX[i] = tangentX * orbitSpeed;
                vY[i] = 0;
                vZ[i] = tangentZ * orbitSpeed;
            }

            requestAnimationFrame(renderFrame);
        }

        function resizeCanvas() {
            state.dpr = Math.min(window.devicePixelRatio || 1, 2);
            state.width = window.innerWidth;
            state.height = window.innerHeight;
            canvas.width = state.width * state.dpr;
            canvas.height = state.height * state.dpr;
            ctx.scale(state.dpr, state.dpr);
        }

        function handlePointerMove(e) {
            const cx = state.width / 2;
            const cy = state.height / 2;
            state.targetYaw = ((e.clientX - cx) / cx) * (Math.PI);
            state.targetPitch = ((e.clientY - cy) / cy) * (Math.PI / 2);
        }

        // --- Phase 1: Field Integration ---
        function renderFrame(time) {
            let dt = time - lastTime;
            lastTime = time;
            if (dt > 50 || isNaN(dt)) dt = 16;
            const dtScale = dt * 0.05;
            state.time += dtScale;

            const cx = state.width / 2;
            const cy = state.height / 2;

            if (!state.isObserved) {
                state.targetYaw += 0.002;
                state.targetPitch = Math.sin(state.time * 0.005) * 0.15 + (Math.PI / 8);
            }

            state.yaw += (state.targetYaw - state.yaw) * 0.08;
            state.pitch += (state.targetPitch - state.pitch) * 0.08;

            const cosY = Math.cos(state.yaw), sinY = Math.sin(state.yaw);
            const cosX = Math.cos(state.pitch), sinX = Math.sin(state.pitch);

            // Tighter alpha clears prevent giant smears. 0.4 offers sharp beautiful trails.
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = state.isObserved ? 'rgba(1, 3, 1, 0.6)' : 'rgba(1, 3, 1, 0.4)';
            ctx.fillRect(0, 0, state.width, state.height);
            ctx.globalCompositeOperation = 'screen';

            for (let i = 0; i < COUNT; i++) {

                // Anti-Explosion fail-safe
                if (isNaN(pX[i]) || isNaN(pY[i]) || isNaN(pZ[i])) {
                    const radius = pEnergyLevel[i] * BOHR_RADIUS;
                    const theta = Math.random() * Math.PI * 2;
                    pX[i] = radius * Math.cos(theta);
                    pY[i] = 0;
                    pZ[i] = radius * Math.sin(theta);
                    vX[i] = 0; vY[i] = 0; vZ[i] = 0;
                }

                const distSq = pX[i]*pX[i] + pY[i]*pY[i] + pZ[i]*pZ[i];
                const dist = Math.sqrt(distSq) + 0.1;
                const invDist = 1.0 / dist;

                // Maintain strictly bounded orbital rings
                const targetRadius = pEnergyLevel[i] * BOHR_RADIUS * 1.3;
                const radialDiff = targetRadius - dist;
                const orbitalForce = radialDiff * 0.03; // Strong restorative force to the ring

                let forceX = (pX[i] * invDist) * orbitalForce;
                let forceY = -pY[i] * 0.2; // Aggressive vertical flattening force
                let forceZ = (pZ[i] * invDist) * orbitalForce;

                // Tangential propulsion (forces continuous spinning orbit)
                const tangentX = -pZ[i] * invDist;
                const tangentZ = pX[i] * invDist;
                const orbitSpeed = 5.0 / (pEnergyLevel[i] * 0.8);

                forceX += tangentX * orbitSpeed - vX[i] * 0.05;
                forceZ += tangentZ * orbitSpeed - vZ[i] * 0.05;
                forceY -= vY[i] * 0.1; // damp vertical velocity

                pPhase[i] += pEnergyLevel[i] * 0.05 * dtScale;

                if (!state.isObserved) {
                    // Slight visual wave-interference (vibration), not huge explosions
                    forceX += Math.sin(pPhase[i]) * 0.3 * pSpin[i];
                    forceY += Math.cos(pPhase[i] * 2) * 0.15;
                    forceZ += Math.sin(pPhase[i]) * 0.3 * -pSpin[i];
                }

                vX[i] += forceX * dtScale;
                vY[i] += forceY * dtScale;
                vZ[i] += forceZ * dtScale;

                // Strict Kinetic Cap
                const velocitySq = vX[i]*vX[i] + vY[i]*vY[i] + vZ[i]*vZ[i];
                if (velocitySq > 36.0) {
                    const maxSpeed = 6.0;
                    const invSpeed = maxSpeed / Math.sqrt(velocitySq);
                    vX[i] *= invSpeed;
                    vY[i] *= invSpeed;
                    vZ[i] *= invSpeed;
                }

                const partnerIdx = pEntangled[i];
                if (Math.random() < 0.005 && partnerIdx < COUNT) {
                    pEnergyLevel[i] = Math.floor(Math.random() * N_LEVELS) + 1;
                    pEnergyLevel[partnerIdx] = pEnergyLevel[i];
                }

                // Momentum & uncertainty
                const momentumSq = vX[i]*vX[i] + vY[i]*vY[i] + vZ[i]*vZ[i];
                const momentum = Math.sqrt(momentumSq);

                if (!state.isObserved) {
                    pUncertainty[i] = Math.min((momentum * PLANCK_H_BAR * 3.0), 10.0);
                } else {
                    pUncertainty[i] = 0.0;
                }

                pX[i] += vX[i] * SPEED * dtScale;
                pY[i] += vY[i] * SPEED * dtScale;
                pZ[i] += vZ[i] * SPEED * dtScale;

                // --- 3D Camera Projection ---
                const x1 = pX[i] * cosY - pZ[i] * sinY;
                const z1 = pZ[i] * cosY + pX[i] * sinY;
                const y1 = pY[i] * cosX - z1 * sinX;
                const z2 = z1 * cosX + pY[i] * sinX;

                const finalZ = z2 + 1500;

                if (finalZ > 10) {
                    const scale = FOV / finalZ;
                    sX[i] = cx + x1 * scale;
                    sY[i] = cy + y1 * scale;
                    sScale[i] = scale;
                    pZRot[i] = finalZ;
                    pVisible[i] = 1;
                } else {
                    pVisible[i] = 0;
                }
            }

            // --- Render Pipeline ---
            ctx.lineWidth = 0.5;
            for (let i = 0; i < COUNT; i += 2) {
                const partner = pEntangled[i];
                if (pVisible[i] && pVisible[partner] && partner < COUNT) {
                    if (!state.isObserved && pEnergyLevel[i] === pEnergyLevel[partner]) {
                        const dx = sX[i] - sX[partner];
                        const dy = sY[i] - sY[partner];
                        const distSq = dx*dx + dy*dy;

                        if (distSq < 250000) {
                            ctx.strokeStyle = PALETTE[0];
                            ctx.globalAlpha = Math.min(sScale[i], 0.12);
                            ctx.beginPath();
                            ctx.moveTo(sX[i], sY[i]);
                            ctx.lineTo(sX[partner], sY[partner]);
                            ctx.stroke();
                        }
                    }
                }
            }

            // Render Sharp Particles
            for (let i = 0; i < COUNT; i++) {
                if (pVisible[i] === 1) {
                    const renderScale = sScale[i];
                    const depthAlpha = Math.min(renderScale * 1.5, 1.0);

                    ctx.fillStyle = PALETTE[pColor[i]];

                    let jitterX = 0;
                    let jitterY = 0;

                    if (!state.isObserved) {
                        // Very subtle uncertainty jitter (keeps it looking sharp but alive)
                        const jitterAmt = Math.min(pUncertainty[i] * 0.3 * renderScale, 4.0);
                        jitterX = (Math.random() - 0.5) * jitterAmt;
                        jitterY = (Math.random() - 0.5) * jitterAmt;
                        ctx.globalAlpha = depthAlpha * 0.8;
                    } else {
                        ctx.globalAlpha = depthAlpha;
                    }

                    ctx.beginPath();
                    ctx.arc(sX[i] + jitterX, sY[i] + jitterY, MAX_SIZE * renderScale, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            requestAnimationFrame(renderFrame);
        }

        window.addEventListener('DOMContentLoaded', initEngine);
    </script>
</body>
</html>
